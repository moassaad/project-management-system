spring:
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  flyway:
    enabled: false

# H2 profile for local development without Docker/PostgreSQL
# Use: JAVA_HOME=/tmp/jdk21 ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Then curl http://localhost:8080/api/v1/health -> {"data":{"status":"UP"}}

server:
  port: 8080

logging:
  level:
    com.projectmanagementsystem: DEBUG
    org.springframework: INFO
