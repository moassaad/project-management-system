spring:
  application:
    name: backend-spring-boot
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

server:
  port: 8080

logging:
  level:
    com.projectmanagementsystem: INFO
    org.springframework: INFO

# Test profile uses H2 in-memory for fast unit/MockMvc tests without Docker
# (PostgreSQL + Testcontainers override for full IT in BE-S002-08 when Docker available)
# JPA/Flyway persistence foundation introduced in BE-S002-03 (validate + baseline)
