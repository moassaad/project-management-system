openapi: 3.1.0
info:
  title: Project Management System
  description: "Project Management System API â generated from code, not manually\
    \ edited"
  version: v1
servers:
- url: /api/v1
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Authenticates user and returns accessToken + HttpOnly refresh cookie
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/LoginResponse"
  /api/v1/health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
