openapi: 3.1.0
info:
  title: Project Management System
  description: "Project Management System API â generated from code, not manually\
    \ edited"
  version: v1
servers:
- url: /
paths:
  /api/v1/projects:
    get:
      tags:
      - projects
      summary: List projects
      description: "Lists projects the caller is a member of, paginated"
      operationId: list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
    post:
      tags:
      - projects
      summary: Create project
      description: Creates a project; creator becomes owner and member
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ProjectResponse"
  /api/v1/projects/{projectId}/tasks:
    get:
      tags:
      - tasks
      summary: List tasks
      description: "Lists project tasks, paginated; members only"
      operationId: list_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
    post:
      tags:
      - tasks
      summary: Create task
      description: "Creates a task; members only, assignee must be a member"
      operationId: create_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/TaskResponse"
  /api/v1/projects/{projectId}/tasks/{taskId}/comments:
    get:
      tags:
      - comments
      summary: List task comments
      description: Lists comments in creation order; members only
      operationId: list_2
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/CommentResponse"
    post:
      tags:
      - comments
      summary: Add task comment
      description: Adds a comment as the caller; members only
      operationId: create_2
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/CommentResponse"
  /api/v1/projects/{projectId}/members:
    get:
      tags:
      - project-members
      summary: List project members
      description: Lists members with roles; members only
      operationId: list_3
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProjectMemberResponse"
    post:
      tags:
      - project-members
      summary: Add project member
      description: Adds an existing user by id or email; owner only
      operationId: add
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMemberRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/AddProjectMemberResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      description: Rotates refresh token and returns new accessToken + new HttpOnly
        refresh cookie
      operationId: refresh
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: Clears refresh cookie and invalidates stored refresh
      operationId: logout
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Authenticates user and returns accessToken + HttpOnly refresh cookie
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/LoginResponse"
  /api/v1/projects/{projectId}:
    get:
      tags:
      - projects
      summary: Get project
      description: Returns a project by id; members only
      operationId: get
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ProjectResponse"
    delete:
      tags:
      - projects
      summary: Delete project
      description: Deletes a project and its memberships; owner only
      operationId: delete
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
    patch:
      tags:
      - projects
      summary: Update project
      description: Partially updates a project; null fields unchanged; owner only
      operationId: patch
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ProjectResponse"
  /api/v1/projects/{projectId}/tasks/{taskId}:
    get:
      tags:
      - tasks
      summary: Get task
      description: Returns a task by id; members only
      operationId: get_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/TaskResponse"
    delete:
      tags:
      - tasks
      summary: Delete task
      description: Deletes a task; members only
      operationId: delete_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
    patch:
      tags:
      - tasks
      summary: Update task
      description: Partially updates a task; null fields unchanged; members only
      operationId: patch_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/TaskResponse"
  /api/v1/health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Current user
      description: Returns current authenticated user
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: {}
  /api/v1/projects/{projectId}/members/{userId}:
    delete:
      tags:
      - project-members
      summary: Remove project member
      description: "Removes a member with immediate access loss; owner only, owner\
        \ cannot be removed"
      operationId: remove
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
components:
  schemas:
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - name
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string
    CreateTaskRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 255
          minLength: 0
        type:
          type: string
        status:
          type: string
        priority:
          type: string
        assigneeId:
          type: string
          format: uuid
        dueDate:
          type: string
          format: date
      required:
      - title
    TaskResponse:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
        status:
          type: string
        priority:
          type: string
        assigneeId:
          type: string
        dueDate:
          type: string
        createdAt:
          type: string
    CreateCommentRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    CommentResponse:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        authorId:
          type: string
        createdAt:
          type: string
    AddProjectMemberRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        targetPresent:
          type: boolean
    AddProjectMemberResponse:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 255
          minLength: 0
        nameValid:
          type: boolean
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 255
          minLength: 0
        type:
          type: string
        status:
          type: string
        priority:
          type: string
        assigneeId:
          type: string
          format: uuid
        dueDate:
          type: string
          format: date
        titleValid:
          type: boolean
    ProjectMemberResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
