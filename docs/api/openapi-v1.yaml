openapi: 3.1.0
info:
  title: Project Management System
  description: "Project Management System API â generated from code, not manually\
    \ edited"
  version: v1
servers:
- url: /
paths:
  /api/v1/projects:
    get:
      tags:
      - projects
      summary: List projects
      description: "Lists projects the caller is a member of, paginated"
      operationId: list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
    post:
      tags:
      - projects
      summary: Create project
      description: Creates a project; creator becomes owner and member
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ProjectResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      description: Rotates refresh token and returns new accessToken + new HttpOnly
        refresh cookie
      operationId: refresh
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: Clears refresh cookie and invalidates stored refresh
      operationId: logout
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Authenticates user and returns accessToken + HttpOnly refresh cookie
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/LoginResponse"
  /api/v1/projects/{projectId}:
    get:
      tags:
      - projects
      summary: Get project
      description: Returns a project by id
      operationId: get
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ProjectResponse"
    delete:
      tags:
      - projects
      summary: Delete project
      description: Deletes a project and its memberships
      operationId: delete
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
    patch:
      tags:
      - projects
      summary: Update project
      description: Partially updates a project; null fields unchanged
      operationId: patch
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ProjectResponse"
  /api/v1/health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Current user
      description: Returns current authenticated user
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: {}
components:
  schemas:
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - name
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 255
          minLength: 0
        nameValid:
          type: boolean
